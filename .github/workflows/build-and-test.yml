name: Build and test

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        shell: pwsh
        run: |
          $code = 'true'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.base_ref }}'
            & git fetch --no-tags --quiet origin $base
            if ($LASTEXITCODE -ne 0) {
              throw "Cannot fetch the base branch '$base'; refusing to guess the changed files."
            }
            $changed = @(& git diff --name-only "origin/$base...HEAD")
            if ($LASTEXITCODE -ne 0) {
              throw "Cannot diff against 'origin/$base'; refusing to guess the changed files."
            }
            # A change that only touches documentation, the changelog or Markdown files cannot change
            # the compiled product, so the Windows jobs are skipped for it.
            $code = if (@($changed | Where-Object { $_ -notmatch '^(docs/|changelog\.d/|.*\.md$)' }).Count -gt 0) { 'true' } else { 'false' }
          }
          "code=$code" >> $env:GITHUB_OUTPUT

  build-and-test:
    name: Build and test (${{ matrix.configuration }})
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build solution
        shell: pwsh
        run: dotnet build Revit.AddinManager.slnx --configuration "${{ matrix.configuration }}" /nologo -warnaserror

      - name: Run headless tests
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/Invoke-HeadlessTests.ps1 -Configuration "${{ matrix.configuration }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults/${{ matrix.configuration }}
          if-no-files-found: ignore

  build-tooling:
    name: Build tooling and sandbox
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build pipeline
        shell: pwsh
        run: dotnet build build/Revit.AddinManager.Build.slnx --configuration Release /nologo -warnaserror

      - name: Build installer generator
        shell: pwsh
        run: dotnet build installer/Revit.AddinManager.Installer.slnx --configuration Release /nologo -warnaserror

      - name: Build sandbox solution
        shell: pwsh
        run: dotnet build sandbox/AddinManager.Sandbox.slnx --configuration Release /nologo -warnaserror

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - build-and-test
      - build-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every required job to pass
        shell: pwsh
        run: |
          $changeResult = '${{ needs.changes.result }}'
          if ($changeResult -ne 'success') {
            throw "Change detection did not run successfully: $changeResult."
          }

          $code = '${{ needs.changes.outputs.code }}'
          if ($code -ne 'true') {
            Write-Host 'Documentation-only change: the compile and test jobs are skipped by design.'
            exit 0
          }

          $failed = [Collections.Generic.List[string]]::new()
          if ('${{ needs.build-and-test.result }}' -ne 'success') { $failed.Add('Build and test') }
          if ('${{ needs.build-tooling.result }}' -ne 'success') { $failed.Add('tooling and sandbox build') }

          if ($failed.Count -gt 0) {
            throw "Required jobs did not pass: $($failed -join ', ')."
          }
          Write-Host 'Every required job passed.'
