name: Publish release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Setup WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2

      - name: Verify the release tag, the changelog and the branch
        shell: pwsh
        run: ./scripts/Verify-Release.ps1 -FromHeadTag -AncestorOf main

      - name: Build and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet run `
            --project build/Revit.AddinManager.Build.csproj `
            -c Release `
            --no-launch-profile `
            -- publish --Publish:Draft=${{ inputs.draft }}
